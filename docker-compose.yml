services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: neverfail
      POSTGRES_USER: neverfail
      POSTGRES_PASSWORD: neverfail
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neverfail"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: neverfail
      DB_USER: neverfail
      DB_PASSWORD: neverfail
    ports:
      - "8080:8080"
    restart: always   # container-level equivalent of the systemd Restart=always

  frontend:
    build: ./frontend
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
